name: Feature request
description: Suggest an idea or improvement for AutoFileSync
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing or inconvenient today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like AutoFileSync to handle this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you have tried.

  - type: dropdown
    id: platform
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - All

  - type: textarea
    id: additional
    attributes:
      label: Additional context
